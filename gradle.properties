# Project-wide Gradle settings. Anything configured in Android Studio's own settings
# overrides what is written here.
# https://docs.gradle.org/current/userguide/build_environment.html

# Memory for the Gradle daemon. Unrelated to the per-app memory limits Android 17 enforces
# at runtime, which MemoryLimitsScreen covers.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Gradle skips the configuration phase entirely when nothing that affects build
# configuration has changed. If you edit a build script and see "Calculating task graph as
# no cached configuration is available", that is this cache correctly missing.
org.gradle.configuration-cache=true

# Only safe for decoupled projects, and pointless for a single-module build like this one.
# org.gradle.parallel=true

# "official" is the Kotlin style guide layout; "obsolete" is the pre-1.3 one.
kotlin.code.style=official
